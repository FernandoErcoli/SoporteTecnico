<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>System Solutions | Gestión Pro</title>
    <!-- Favicon Oficial con ruta absoluta -->
    <link rel="icon" type="image/png" href="https://fernandoercoli.github.io/SoporteTecnico/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03050a; 
            --card: #0a0e1a; 
            --primary: #7c6dfa;
            --secondary: #9185ff; 
            --cyan: #4af0ff;
            --amber: #ffb700;
            --text: #e0e6ed; 
            --border: #1e293b;
            --muted: #6a7999;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg); 
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            margin: 0; 
            padding: 16px;
        }

        /* ── LOGIN SCREEN ── */
        #loginScreen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 12px;
            padding: 40px 36px;
            width: 100%; max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(124,109,250,.08);
        }
        .login-logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem; font-weight: 800;
            color: var(--primary); letter-spacing: 3px;
            margin-bottom: 6px;
        }
        .login-logo span { color: var(--muted) }
        .login-sub {
            font-size: .72rem; color: var(--muted);
            letter-spacing: 1px; margin-bottom: 32px;
        }
        .login-label {
            font-size: .65rem; letter-spacing: 2px;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 8px; display: block;
        }
        .login-input {
            width: 100%; background: #0f1526;
            border: 1px solid var(--border);
            color: white; padding: 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem; font-weight: 700;
            letter-spacing: 4px;
            transition: border-color .2s, box-shadow .2s;
            margin-bottom: 20px;
        }
        .login-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(124,109,250,.15); }
        .login-btn {
            width: 100%; background: var(--primary);
            color: black; border: none;
            padding: 15px; border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .85rem; font-weight: 800;
            letter-spacing: 1.5px; cursor: pointer;
            transition: background .2s, box-shadow .2s;
        }
        .login-btn:hover { background: var(--secondary); box-shadow: 0 4px 20px rgba(124,109,250,.3); }
        .login-error {
            color: #ff4b2b; font-size: .72rem;
            letter-spacing: 1px; margin-top: 12px;
            text-align: center; display: none;
            animation: shake .3s ease;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}
        }
        .login-dot {
            display: inline-block; width: 6px; height: 6px;
            border-radius: 50%; background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: blink 1.2s step-end infinite;
            margin-right: 6px; vertical-align: middle;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* ── APP (oculto hasta login) ── */
        #app { display: none; }

        .header { 
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            padding: 20px; 
            border-radius: 8px;
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 12px; 
        }
        .header h1 { color: var(--text); margin: 0; font-size: clamp(16px, 5vw, 22px); letter-spacing: 1px; }
        .header h1 span { color: var(--primary); }
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .sync-btn { 
            background: transparent; border: 1px solid var(--primary); color: var(--primary); 
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; 
            font-family: inherit; font-weight: 700; display: flex; align-items: center; gap: 8px; 
        }
        .sync-btn:hover { background: var(--primary); color: black; }
        .sync-btn.loading svg { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .logout-btn {
            background: transparent; border: 1px solid rgba(255,75,43,.4);
            color: rgba(255,75,43,.7); padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-size: 12px;
            font-family: inherit; font-weight: 700;
            transition: all .2s;
        }
        .logout-btn:hover { background: rgba(255,75,43,.1); color: #ff4b2b; }
        .last-update { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
        .last-update span { color: var(--cyan); }
        .next-refresh { font-size: 11px; color: var(--muted); }
        .next-refresh b { color: var(--amber); }
        .container { max-width: 1100px; margin: auto; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 24px; border-radius: 8px; margin-bottom: 16px; }
        .card h3 { margin: 0 0 18px; font-size: 14px; letter-spacing: 1.5px; color: var(--primary); }
        .card h3::before { content: "// "; color: var(--muted); }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr 1fr; } }
        input, select, button, textarea { 
            background: #0f1526; border: 1px solid var(--border); color: white; 
            padding: 14px; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 700;
        }
        input, select { width: 100%; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        button { cursor: pointer; border: none; }
        .btn-primary { background: var(--primary); color: black; width: 100%; margin-top: 16px; padding: 16px; font-size: 14px; border-radius: 6px; letter-spacing: 1px; }
        .btn-primary:hover { background: var(--secondary); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        #buscador { width: 100%; margin-bottom: 8px; background: #0f1526; border-color: var(--border); }
        @media (min-width: 640px) {
            table { width: 100%; border-collapse: collapse; margin-top: 16px; display: table; }
            thead { display: table-header-group; } tbody { display: table-row-group; }
            tr { display: table-row; } tr:hover td { background: #0d1324; }
            th, td { display: table-cell; }
            th { color: var(--muted); text-align: left; padding: 14px; font-size: 13px; border-bottom: 2px solid var(--border); letter-spacing: 1px; }
            td { padding: 16px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 14px; }
        }
        @media (max-width: 639px) {
            table, thead, tbody, tr, th, td { display: block; width: 100%; }
            thead { display: none; }
            tr { background: #0f1526; border: 1px solid var(--border); border-radius: 8px; margin-top: 14px; padding: 14px; }
            td { padding: 6px 0; border: none; font-size: 14px; display: flex; align-items: flex-start; gap: 8px; }
            td::before { content: attr(data-label); color: var(--primary); font-size: 11px; font-weight: 800; letter-spacing: 1px; min-width: 80px; text-transform: uppercase; }
            td.td-acciones { flex-wrap: wrap; gap: 8px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border); }
            td.td-acciones::before { display: none; }
        }
        .status-badge { padding: 6px 12px; border-radius: 4px; font-size: 12px; white-space: nowrap; display: inline-block; }
        .status-pendiente { background: rgba(255,183,0,.1); color: var(--amber); border: 1px solid rgba(255,183,0,.25); }
        .status-taller { background: rgba(255,183,0,.1); color: var(--amber); border: 1px solid rgba(255,183,0,.25); }
        .status-listo { background: rgba(74,240,255,.1); color: var(--cyan); border: 1px solid rgba(74,240,255,.25); }
        .btn-wa { background: rgba(37,211,102,.1); color: #25D366; border: 1px solid rgba(37,211,102,.3); padding: 8px 14px; border-radius: 5px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-wa:hover { background: #25D366; color: black; }
        .btn-edit { background: rgba(31,111,235,.15); color: #58a6ff; border: 1px solid rgba(31,111,235,.4); padding: 8px 14px; border-radius: 5px; font-size: 13px; }
        .btn-edit:hover { background: #1f6feb; color: white; }
        .btn-delete { background: rgba(255,75,43,.15); color: #ff6b4b; border: 1px solid rgba(255,75,43,.4); padding: 8px 14px; border-radius: 5px; font-size: 13px; }
        .btn-delete:hover { background: #ff4b2b; color: white; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(3,5,10,.85); z-index: 1000; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
        @media (min-width: 640px) { .modal-overlay { align-items: center; padding: 20px; } }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--primary); border-radius: 16px 16px 0 0; padding: 28px; width: 100%; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: slideUp 0.25s ease; max-height: 92vh; overflow-y: auto; }
        @media (min-width: 640px) { .modal { border-radius: 8px; animation: slideIn 0.2s ease; } }
        @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h3 { color: var(--text); margin-top: 0; margin-bottom: 20px; font-size: 16px; letter-spacing: 1px; }
        .modal-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 480px) { .modal-grid { grid-template-columns: 1fr 1fr; } }
        .modal-grid .full-width { grid-column: 1 / -1; }
        .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; flex-wrap: wrap; }
        .btn-cancel { background: #161b22; color: var(--text); border: 1px solid var(--border); padding: 12px 20px; border-radius: 6px; }
        .btn-cancel:hover { background: #21262d; }
        .wa-modal { background: var(--card); border: 1px solid var(--border); border-top: 4px solid #25D366; border-radius: 16px 16px 0 0; padding: 28px; width: 100%; max-width: 540px; box-shadow: 0 10px 40px rgba(0,0,0,.5); animation: slideUp 0.25s ease; max-height: 92vh; overflow-y: auto; }
        @media (min-width: 640px) { .wa-modal { border-radius: 8px; animation: slideIn 0.2s ease; } }
        .wa-modal h3 { color: #25D366; margin-top: 0; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 16px; }
        .wa-modal .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
        .wa-modal textarea { width: 100%; min-height: 140px; padding: 14px; border-radius: 6px; resize: vertical; line-height: 1.6; font-size: 14px; background: #0f1526; border-color: var(--border); }
        .template-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .tpl-btn { background: #0f1526; border: 1px solid rgba(37,211,102,.4); color: #25D366; padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: 700; }
        .tpl-btn:hover { background: rgba(37,211,102,.15); }
        .btn-send-wa { background: #25D366; color: black; padding: 14px 24px; font-size: 14px; border-radius: 6px; display: flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; }
        .btn-send-wa:hover { background: #1ebe5a; }
        .wa-number { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
        .wa-number span { color: var(--cyan); }
        .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: -12px auto 20px; }
        @media (min-width: 640px) { .modal-handle { display: none; } }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0f1526; border: 1px solid var(--primary); color: var(--primary); padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
        .toast.show { opacity: 1; }
        .toast.error { border-color: #ff4b2b; color: #ff4b2b; }
        .skeleton { background: linear-gradient(90deg, #0f1526 25%, #1e293b 50%, #0f1526 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; height: 16px; margin: 10px 0; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
    </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo"><span>[</span>SYSTEM SOLUTIONS<span>]</span></div>
        <div class="login-sub"><span class="login-dot"></span>PANEL DE GESTIÓN · ACCESO PRIVADO</div>
        <label class="login-label">// Contraseña</label>
        <input type="password" class="login-input" id="loginInput" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') verificarLogin()"/>
        <button class="login-btn" onclick="verificarLogin()">> INGRESAR</button>
        <div class="login-error" id="loginError">✗ Contraseña incorrecta</div>
    </div>
</div>

<!-- ── APP ── -->
<div id="app">
<div class="container">
    <div class="header">
        <h1>[<span>SYSTEM SOLUTIONS</span>]</h1>
        <div class="header-right">
            <div class="header-btns">
                <button class="sync-btn" id="syncBtn" onclick="cargarDatos()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    Actualizar
                </button>
                <button class="logout-btn" onclick="cerrarSesion()">✕ Salir</button>
            </div>
            <div class="last-update" id="lastUpdate" style="display:none">
                Últ. sincronización: <span id="lastUpdateTime">—</span>
            </div>
            <div class="next-refresh" id="nextRefresh" style="display:none">
                Auto-refresh en <b id="countdown">10:00</b>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>REGISTRAR NUEVO TRABAJO</h3>
        <div class="form-grid">
            <input type="text" id="cliente" placeholder="Nombre del Cliente">
            <input type="text" id="whatsapp" placeholder="WhatsApp (ej: 5491112345678)">
            <input type="text" id="equipo" placeholder="Equipo (ej: Notebook Dell)">
            <input type="text" id="trabajo" placeholder="Trabajo (ej: Limpieza + SSD)">
            <input type="number" id="monto" placeholder="Monto $">
            <select id="estado">
                <option value="Pendiente">Pendiente</option>
                <option value="Taller">En Taller</option>
                <option value="Listo">Listo / Entregado</option>
            </select>
        </div>
        <button class="btn-primary" id="btnGuardar" onclick="guardarDato()">> GUARDAR EN BASE DE DATOS</button>
    </div>

    <div class="card">
        <input type="text" id="buscador" onkeyup="buscar()" placeholder="🔍 Filtrar por cliente, equipo o trabajo...">
        <div id="contenidoTabla">
            <div style="padding: 20px 0;">
                <div class="skeleton" style="width:100%;height:16px"></div>
                <div class="skeleton" style="width:80%;height:16px"></div>
                <div class="skeleton" style="width:90%;height:16px"></div>
            </div>
        </div>
    </div>
</div>
</div>

<div class="toast" id="toast"></div>

<!-- Modal edición -->
<div class="modal-overlay" id="modalOverlay" onclick="cerrarModalSiAfuera(event)">
    <div class="modal">
        <div class="modal-handle"></div>
        <h3>✏️ EDITAR REGISTRO</h3>
        <div class="modal-grid">
            <input type="text" id="edit-cliente" placeholder="Nombre del Cliente">
            <input type="text" id="edit-whatsapp" placeholder="WhatsApp">
            <input type="text" id="edit-equipo" placeholder="Equipo">
            <input type="number" id="edit-monto" placeholder="Monto $">
            <input type="text" id="edit-trabajo" placeholder="Trabajo realizado" class="full-width">
            <select id="edit-estado" class="full-width">
                <option value="Pendiente">Pendiente</option>
                <option value="Taller">En Taller</option>
                <option value="Listo">Listo / Entregado</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            <button id="btnSaveEdit" style="background:var(--primary);color:black;padding:12px 24px;border-radius:6px;" onclick="guardarEdicion()">💾 GUARDAR</button>
        </div>
    </div>
</div>

<!-- Modal WhatsApp -->
<div class="modal-overlay" id="waOverlay" onclick="cerrarWASiAfuera(event)">
    <div class="wa-modal">
        <div class="modal-handle"></div>
        <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>

        <div class="template-btns">
            <button class="tpl-btn" onclick="setTemplate('listo')">✅ Listo</button>
            <button class="tpl-btn" onclick="setTemplate('presupuesto')">💰 Presupuesto</button>
            <button class="tpl-btn" onclick="setTemplate('demora')">⏳ Demora</button>
            <button class="tpl-btn" onclick="setTemplate('retiro')">📦 Retiro</button>
        </div>
        <textarea id="wa-mensaje"></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="cerrarWA()">Cancelar</button>
            <a id="btn-send-wa-link" href="javascript:void(0)" target="_blank" class="btn-send-wa" onclick="prepararEnvioWA(event)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="black"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                ABRIR EN WHATSAPP
            </a>
        </div>
    </div>
</div>

<script>
    const API = 'https://script.google.com/macros/s/AKfycbxR3nmXaB7340Rr21h_wUWAmvbXlKet5Q0pvZ0bQipB-eP-Le0YSrtrg4nokVEQFuwsbg/exec';
    const PASS = 'Niwa4071';
    let baseDeDatos = [], editIndex = null, waItem = null;
    const REFRESH_INTERVAL = 10 * 60;
    let secondsLeft = REFRESH_INTERVAL, countdownTimer = null;

    // ── LOGIN ──
    function verificarLogin() {
        const input = document.getElementById('loginInput').value;
        const error = document.getElementById('loginError');
        if (input === PASS) {
            sessionStorage.setItem('ss_auth', '1');
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            cargarDatos();
        } else {
            error.style.display = 'block';
            error.style.animation = 'none';
            setTimeout(() => error.style.animation = '', 10);
            document.getElementById('loginInput').value = '';
            document.getElementById('loginInput').focus();
        }
    }

    function cerrarSesion() {
        sessionStorage.removeItem('ss_auth');
        document.getElementById('app').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginInput').value = '';
    }

    // Verificar si ya está autenticado
    if (sessionStorage.getItem('ss_auth') === '1') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    }

    // ── AUTO-REFRESH ──
    function iniciarCountdown() {
        secondsLeft = REFRESH_INTERVAL;
        if (countdownTimer) clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
            secondsLeft--;
            actualizarCountdown();
            if (secondsLeft <= 0) cargarDatos();
        }, 1000);
        actualizarCountdown();
        document.getElementById('nextRefresh').style.display = 'block';
    }
    function actualizarCountdown() {
        const m = String(Math.floor(Math.max(0, secondsLeft) / 60)).padStart(2, '0');
        const s = String(Math.max(0, secondsLeft) % 60).padStart(2, '0');
        document.getElementById('countdown').textContent = `${m}:${s}`;
    }
    function actualizarHoraUltSync() {
        const ahora = new Date();
        const h = String(ahora.getHours()).padStart(2, '0');
        const m = String(ahora.getMinutes()).padStart(2, '0');
        const s = String(ahora.getSeconds()).padStart(2, '0');
        document.getElementById('lastUpdateTime').textContent = `${h}:${m}:${s}`;
        document.getElementById('lastUpdate').style.display = 'flex';
    }

    const E = {
        wave: decodeURIComponent('%F0%9F%91%8B'), check: decodeURIComponent('%E2%9C%85'),
        money: decodeURIComponent('%F0%9F%92%B0'), box: decodeURIComponent('%F0%9F%93%A6'),
        pray: decodeURIComponent('%F0%9F%99%8F'), clap: decodeURIComponent('%F0%9F%99%8C'),
        clock: decodeURIComponent('%E2%8F%B3')
    };
    const templates = {
        listo:       (i) => `Hola ${i.cliente}! ${E.wave} Te avisamos que tu *${i.equipo}* ya está listo para retirar.\n\nTrabajo realizado: ${i.trabajo}\nMonto: $${i.monto}\n\nCualquier consulta estamos a disposición. ¡Gracias por elegirnos! ${E.clap}`,
        presupuesto: (i) => `Hola ${i.cliente}! Te pasamos el presupuesto para tu *${i.equipo}*:\n\n${E.check} Trabajo: ${i.trabajo}\n${E.money} Monto: $${i.monto}\n\nAvisanos si lo aprobás para arrancar. Saludos!`,
        demora:      (i) => `Hola ${i.cliente}! Te queremos avisar que tu *${i.equipo}* va a demorar un poco más de lo previsto. ${E.clock} Te confirmamos fecha en cuanto tengamos novedades. Disculpá los inconvenientes! ${E.pray}`,
        retiro:      (i) => `Hola ${i.cliente}! ${E.wave} Te recordamos que tu *${i.equipo}* está listo y esperándote para retirar. ${E.box} Pasá cuando puedas por el taller. ¡Hasta pronto!`
    };

    function showToast(msg, error = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast' + (error ? ' error' : '') + ' show';
        setTimeout(() => t.className = 'toast', 3000);
    }
    function setSyncLoading(on) { document.getElementById('syncBtn').classList.toggle('loading', on); }

    async function cargarDatos() {
        setSyncLoading(true);
        try {
            const res = await fetch(API);
            baseDeDatos = await res.json();
            renderTabla(baseDeDatos);
            actualizarHoraUltSync();
            iniciarCountdown();
        } catch(e) {
            showToast('Error al cargar datos', true);
            renderTabla([]);
        }
        setSyncLoading(false);
    }

    async function apiPost(payload) {
        const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
        return res.json();
    }

    async function guardarDato() {
        const fields = ['cliente','whatsapp','equipo','trabajo','monto','estado'];
        const entry = {};
        fields.forEach(f => entry[f] = document.getElementById(f).value);
        if (!entry.cliente) return showToast('Error: Complete al menos el nombre del cliente.', true);
        const btn = document.getElementById('btnGuardar');
        btn.disabled = true; btn.textContent = 'Guardando...';
        try {
            await apiPost({ action: 'add', ...entry });
            fields.slice(0,5).forEach(id => document.getElementById(id).value = '');
            document.getElementById('estado').value = 'Taller';
            showToast('✅ Registro guardado correctamente');
            await cargarDatos();
        } catch(e) { showToast('Error al guardar', true); }
        btn.disabled = false; btn.textContent = '> GUARDAR EN BASE DE DATOS';
    }

    async function guardarEdicion() {
        if (editIndex === null) return;
        const fields = ['cliente','whatsapp','equipo','trabajo','monto','estado'];
        const entry = {};
        fields.forEach(f => entry[f] = document.getElementById('edit-' + f).value);
        const btn = document.getElementById('btnSaveEdit');
        btn.disabled = true; btn.textContent = 'Actualizando...';
        try {
            await apiPost({ action: 'update', index: editIndex, ...entry });
            cerrarModal();
            showToast('✅ Registro actualizado con éxito');
            await cargarDatos();
        } catch(e) { showToast('Error al actualizar', true); }
        btn.disabled = false; btn.textContent = '💾 GUARDAR';
    }

    async function borrar(index) {
        if (!confirm('¿Eliminar este registro de forma permanente?')) return;
        try {
            await apiPost({ action: 'delete', index });
            showToast('🗑️ Registro eliminado');
            await cargarDatos();
        } catch(e) { showToast('Error al eliminar', true); }
    }

    function renderTabla(data) {
        const wrap = document.getElementById('contenidoTabla');
        if (!data.length) {
            wrap.innerHTML = `<div class="empty-state">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 17H7A5 5 0 017 7h10a5 5 0 010 10h-2M12 12v5m0 0l-2-2m2 2l2-2"/></svg>
                <p>No se encontraron registros activos</p>
            </div>`;
            return;
        }
        let html = `<table><thead><tr>
            <th>CLIENTE</th><th>EQUIPO</th><th>TRABAJO</th><th>MONTO</th><th>ESTADO</th><th>ACCIONES</th>
        </tr></thead><tbody>`;
        data.forEach((item, index) => {
            const estado = item.estado || 'Taller';
            let estadoTexto = estado.toUpperCase();
            if (estado === 'Taller') estadoTexto = 'EN TALLER';
            html += `<tr>
                <td data-label="Cliente" style="color:#fff">${item.cliente}</td>
                <td data-label="Equipo" style="color:var(--cyan)">${item.equipo}</td>
                <td data-label="Trabajo">${item.trabajo}</td>
                <td data-label="Monto" style="color:var(--amber);font-weight:800">$${item.monto}</td>
                <td data-label="Estado"><span class="status-badge status-${estado.toLowerCase()}">${estadoTexto}</span></td>
                <td class="td-acciones">
                    <button class="btn-wa" onclick="abrirWA(${index})">WA</button>
                    <button class="btn-edit" onclick="abrirModal(${index})">Editar</button>
                    <button class="btn-delete" onclick="borrar(${index})">✕</button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        wrap.innerHTML = html;
    }

    function buscar() {
        const filter = document.getElementById('buscador').value.toUpperCase();
        document.querySelectorAll('#contenidoTabla tbody tr').forEach(row => {
            row.style.display = row.innerText.toUpperCase().includes(filter) ? '' : 'none';
        });
    }

    function abrirModal(index) {
        editIndex = index;
        const item = baseDeDatos[index];
        ['cliente','whatsapp','equipo','trabajo','monto','estado'].forEach(f => {
            document.getElementById('edit-' + f).value = item[f] || '';
        });
        document.getElementById('modalOverlay').classList.add('active');
    }
    function cerrarModal() { document.getElementById('modalOverlay').classList.remove('active'); editIndex = null; }
    function cerrarModalSiAfuera(e) { if (e.target === document.getElementById('modalOverlay')) cerrarModal(); }

    function abrirWA(index) {
        waItem = baseDeDatos[index];
        document.getElementById('wa-num-text').textContent = waItem.whatsapp || '(sin número)';
        document.getElementById('wa-mensaje').value = templates[waItem.estado === 'Listo' ? 'listo' : 'presupuesto'](waItem);
        document.getElementById('waOverlay').classList.add('active');
    }
    function setTemplate(tpl) { if (waItem) document.getElementById('wa-mensaje').value = templates[tpl](waItem); }
    function prepararEnvioWA(e) {
        e.preventDefault();
        if (!waItem) return;
        const numero = String(waItem.whatsapp || '').replace(/\D/g, '');
        if (!numero) { showToast('Error: El cliente no tiene número asignado', true); return; }
        const url = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(document.getElementById('wa-mensaje').value);
        window.open(url, '_blank');
        setTimeout(() => cerrarWA(), 300);
    }
    function cerrarWA() { document.getElementById('waOverlay').classList.remove('active'); waItem = null; }
    function cerrarWASiAfuera(e) { if (e.target === document.getElementById('waOverlay')) cerrarWA(); }

    // Iniciar si ya está autenticado
    if (sessionStorage.getItem('ss_auth') === '1') cargarDatos();
</script>
</body>
</html>
